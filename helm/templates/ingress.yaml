{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ragflow.fullname" . }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $apiServiceName := printf "%s-api" $.Release.Name }}
          {{- $serviceName := "" }}
          {{- $usePortName := true }}
          {{- $portValue := "http" }}
          {{- if and .backend .backend.service }}
          {{- if eq .backend.service.name "api" }}
          {{- $serviceName = $apiServiceName }}
          {{- else }}
          {{- $serviceName = .backend.service.name }}
          {{- end }}
          {{- if and (eq $serviceName $apiServiceName) (not $.Values.ragflow.api.service.enabled) }}
          {{- fail (printf "Path %s routes to ragflow-api service, but ragflow.api.service.enabled is false. Please enable it in values.yaml" .path) }}
          {{- end }}
          {{- if .backend.service.port.name }}
          {{- $portValue = .backend.service.port.name }}
          {{- $usePortName = true }}
          {{- else if .backend.service.port.number }}
          {{- $portValue = .backend.service.port.number }}
          {{- $usePortName = false }}
          {{- else if .backend.service.port }}
          {{- $portValue = .backend.service.port }}
          {{- $usePortName = true }}
          {{- end }}
          {{- else }}
          {{- $serviceName = (include "ragflow.fullname" $) }}
          {{- end }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ $serviceName | quote }}
                port:
                  {{- if $usePortName }}
                  name: {{ $portValue }}
                  {{- else }}
                  number: {{ $portValue }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
